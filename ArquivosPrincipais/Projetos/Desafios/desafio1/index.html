<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Produtos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- menu de cima -->
  <nav class="navbar navbar-dark">
    <div class="container">
      <span class="navbar-brand">Cadastro de Produtos</span>
      <button id="darkMode" class="btn btn-light btn-sm">Modo escuro</button>
    </div>
  </nav>

  <!-- parte principal -->
  <main class="container py-4">
    <div class="topo">
      <small>CONTROLE DE ESTOQUE</small>
      <h1>Cadastro de produtos</h1>
      <p>Cadastre seus produtos e veja a lista abaixo.</p>
    </div>

    <div id="alertArea"></div>

    <!-- formulario pra cadastrar ou editar -->
    <div class="card mb-4">
      <div class="card-body">
        <h2 id="formTitle">Novo produto</h2>
        <form id="productForm">
          <div class="row g-3">
            <div class="col-md-5">
              <label class="form-label">Nome</label>
              <input id="nome" class="form-control" type="text">
            </div>
            <div class="col-md-3">
              <label class="form-label">Categoria</label>
              <select id="categoria" class="form-select">
                <option value="">Selecione</option>
                <option>Eletrônicos</option>
                <option>Informática</option>
                <option>Casa</option>
                <option>Escritório</option>
                <option>Outros</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label">Preço</label>
              <input id="preco" class="form-control" type="number" step="0.01">
            </div>
            <div class="col-md-2">
              <label class="form-label">Quantidade</label>
              <input id="quantidade" class="form-control" type="number">
            </div>
          </div>
          <div class="mt-3">
            <button id="submitBtn" class="btn btn-main" type="submit">Cadastrar</button>
            <button id="clearBtn" class="btn btn-secondary" type="button">Limpar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- pesquisa e ordem dos produtos -->
    <div class="d-flex justify-content-between align-items-center mb-3 gap-2">
      <h2>Produtos</h2>
      <div class="d-flex gap-2">
        <input id="searchInput" class="form-control" type="search" placeholder="Pesquisar">
        <select id="sortSelect" class="form-select">
          <option value="recent">Recentes</option>
          <option value="low">Menor preço</option>
          <option value="high">Maior preço</option>
        </select>
      </div>
    </div>

    <!-- os produtos aparecem aqui -->
    <div id="productList" class="row g-3"></div>
    <div id="emptyState" class="empty">
      <h4>Nenhum produto cadastrado.</h4>
      <p>Use o formulário acima para adicionar um produto.</p>
    </div>
  </main>

  <footer><div class="container py-3">Cadastro de Produtos</div></footer>
  <script src="js/script.js"></script>
</body>
</html>
